<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bhutada Family Tree</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <!-- ==========================================
         Header
    ========================================== -->

    <header id="appHeader">

        <div id="logoArea">

            <h1>🌳 Bhutada Family Tree</h1>

            <p>
                Five Generation Interactive Family Tree
            </p>

        </div>

    </header>



    <!-- ==========================================
         Toolbar
    ========================================== -->

    <section id="toolbar">

        <button id="btnExpandAll">

            Expand All

        </button>

        <button id="btnCollapseAll">

            Collapse All

        </button>

        <button id="btnFitScreen">

            Fit to Screen

        </button>

        <button id="btnResetZoom">

            Reset Zoom

        </button>

        <div id="searchContainer">

            <input
                type="text"
                id="txtSearch"
                placeholder="Search Name/Contact">

            <div id="searchResults"></div>

        </div>
    </section>


    <!-- ==========================================
     Main Application Layout
========================================== -->

<div id="mainLayout">

    <!-- ==========================================
         Family Details Panel
    ========================================== -->

    <aside id="memberPanel">

        <div id="popupHeader">

            <h2 id="popupMemberName">
                Select a Member
            </h2>

            <button id="btnClosePopup" type="button">
                ✕
            </button>

        </div>


        <div id="popupBody">

            <div id="emptyMemberMessage">

                <div class="emptyMemberIcon">
                    👤
                </div>

                <h3>Select a Member</h3>

                <p>
                    Click any member in the family tree
                    to view their details here.
                </p>

            </div>


            <div id="memberDetailsContent">

    <!-- ==========================================
         Personal Information
    =========================================== -->

    <div class="detailsSection">

        <div class="detailsSectionTitle">
            Personal Information
        </div>


        <div class="detailRow">

            <div class="detailLabel">
                Name
            </div>

            <div
                class="detailValue"
                id="popName">
            </div>

        </div>


        <div class="detailRow">

            <div class="detailLabel">
                Role
            </div>

            <div
                class="detailValue"
                id="popRole">
            </div>

        </div>


        <div class="detailRow">

            <div class="detailLabel">
                Contact
            </div>

            <div
                class="detailValue"
                id="popContact">
            </div>

        </div>


        <div class="detailRow">

            <div class="detailLabel">
                Date of Birth
            </div>

            <div
                class="detailValue"
                id="popDOB">
            </div>

        </div>


        <div class="detailRow">

            <div class="detailLabel">
                Anniversary
            </div>

            <div
                class="detailValue"
                id="popDOA">
            </div>

        </div>


        <div class="detailRow">

            <div class="detailLabel">
                Demise
            </div>

            <div
                class="detailValue"
                id="popDOD">
            </div>

        </div>

    </div>


    <!-- ==========================================
         Family Relationships
    =========================================== -->

    <div class="detailsSection">

        <div class="detailsSectionTitle">
            Family
        </div>


        <div class="detailRow">

            <div class="detailLabel">
                Spouse
            </div>

            <div
                class="detailValue"
                id="popSpouse">
            </div>

        </div>


        <div class="detailRow">

            <div class="detailLabel">
                Parents
            </div>

            <div
                class="detailValue"
                id="popParents">
            </div>

        </div>


        <div class="detailRow">

            <div class="detailLabel">
                Children
            </div>

            <div
                class="detailValue"
                id="popChildren">
            </div>

        </div>

    </div>

</div>

        </div>

    </aside>


    <!-- ==========================================
         Family Tree
    ========================================== -->

    <main id="treeViewport">

        <div id="treeWrapper">

            <div id="treeCanvas">

            </div>

        </div>

    </main>

</div>



    <!-- ==========================================
         Status Bar
    ========================================== -->

    <footer id="statusBar">

        Ready

    </footer>



    <!-- ==========================================
         Scripts
    ========================================== -->

    <script src="js/utils.js"></script>

    <script src="js/data.js"></script>

    <script src="js/tree.js"></script>

    <script src="js/renderer.js"></script>

    <script src="js/app.js"></script>

</body>

</html>
